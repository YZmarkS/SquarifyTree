name: Attach MacOS Release
run-name: Attach MacOS Build to Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach to"
        required: true
        type: string

jobs:
  build:
    strategy:
      matrix:
        os:
          [ macos-latest, macos-15-intel ]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: "Rustup: Checking toolchain"
        run: rustup --version
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            **/target/
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: "cargo: Building for ${{ matrix.os }}"
        run: cargo build --profile release
      - name: "Upload: Upload to release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp target/release/treedu.exe treedu-${{ matrix.os }}
          gh release upload ${{ inputs.tag }} treedu-${{ matrix.os }} --clobber
